# Math RL on 2 H200 GPUs (1 trainer + 1 inference) via the Tau `train` target
# (tau/train.yaml). Derived from configs/basic/hendrycks-sanity/rl.toml: swapped the
# 1.5B sanity model for the 7B primary experiment model, added rank-16 LoRA, disabled
# math-env-v1's LLM reference-judge fallback for deterministic reward, and added a
# math500-v1 held-out eval (startup + periodic + final). See the W2 selection memo for
# the full rationale (model/renderer/taskset/LoRA compatibility).
#
# Bounded step count: this value is a placeholder until throughput is measured on the
# real H200 pod (see tau/README.md's proof ladder). Override per-run with
# `--max-steps N` (the Tau wrapper also honors `$PRIME_RL_MAX_STEPS`).
max_steps = 50

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen2.5-7B-Instruct"

[wandb]
project = "tau-math-7b-h200"
name = "math-7b-h200-train"

[file_monitor]

[trainer.model.lora]
rank = 16

[trainer.ckpt.weights]
# Write the raw LoRA adapter alongside merged weights so the standalone frozen eval
# (tau/eval-post.yaml, PRIME_RL_EVAL_LABEL=post) can load just the adapter for inference.
save_adapter_separately = true

[orchestrator]
batch_size = 128
group_size = 8
seq_len = 8192

[orchestrator.model.lora]
name = "r16-math"

[[orchestrator.train.source]]
name = "math-env"

[orchestrator.train.source.env.taskset]
id = "math-env-v1"
dataset_name = "PrimeIntellect/Hendrycks-Math"
dataset_subset = "default"
dataset_split = "train"

[orchestrator.train.source.env.taskset.task]
# math-env-v1 defaults to an LLM reference-judge fallback for answers math-verify can't
# symbolically match. Disable it ("None" -> Python None per pydantic_config's TOML null
# convention, see deps/pydantic-config/src/pydantic_config/cli.py) so training reward
# stays purely deterministic (math-verify only) — required for the frozen-eval
# comparison protocol, which assumes a fixed, side-effect-free grader.
judge = "None"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

# All 500 pinned MATH-500 rows, group_size=1 (single sample per problem — this is a
# held-out accuracy check, not a pass@k estimate). skip_first_step defaults to false,
# so this also runs as the in-run "startup" (base-model) eval at step 0. interval=25
# with max_steps=50 above lands a periodic eval at step 25 and a final one at step 50;
# adjust together if max_steps changes. This in-run eval is a monitoring signal only —
# the frozen pre/post comparison in tau/eval-post.yaml + tau/eval_tools is the eval of
# record for the hill-climb claim (see docs/model-env-selection memo's caveat that
# aggregate training logs never substitute for the frozen paired eval).
[orchestrator.eval]
interval = 25
num_examples = 500
group_size = 1

[[orchestrator.eval.source]]
name = "math500"

[orchestrator.eval.source.env.taskset]
id = "math500-v1"

[orchestrator.eval.source.env.agent.harness]
id = "null"

[orchestrator.eval.source.env.agent.runtime]
type = "subprocess"

[trainer.model]
seq_len = 16384

[inference]
enable_lora = true

[inference.model]
max_model_len = 8192

# Qwen2.5-7B-Instruct is not in MODEL_RENDERER_MAP — opt into DefaultRenderer
# (apply_chat_template). No reasoning_parser: this is a plain instruct model, not a
# reasoning model with <think> tags (contrast configs/basic/hendrycks-sanity/rl.toml's
# R1-Distill model, which sets reasoning_parser = "think").
[orchestrator.renderer]
name = "default"
