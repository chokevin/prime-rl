# Math RL duration-only F12 experiment on 2 H200 GPUs (1 trainer + 1 inference).
# This is the immutable F10 contract with only max_steps and monitoring eval interval
# changed. The external frozen baseline/post comparison remains the eval of record.
max_steps = 200

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen2.5-7B-Instruct"

[wandb]
project = "tau-math-7b-h200"
name = "math-7b-h200-train"

[file_monitor]

[trainer.model.lora]
rank = 16

[trainer.ckpt.weights]
# Write the raw LoRA adapter alongside merged weights so the standalone frozen eval
# can load only the exact final adapter selected at step 200.
save_adapter_separately = true

[orchestrator]
batch_size = 128
group_size = 8
seq_len = 8192

[orchestrator.ckpt]

[orchestrator.model.lora]
name = "r16-math"

[[orchestrator.train.source]]
name = "math-env"

[orchestrator.train.source.env.taskset]
id = "math-env-v1"
dataset_name = "PrimeIntellect/Hendrycks-Math"
dataset_subset = "default"
dataset_split = "train"

[orchestrator.train.source.env.taskset.task]
# Keep reward purely deterministic (math-verify only).
judge = "None"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

# All 500 pinned MATH-500 rows at startup, step 100, and step 200. These are monitoring
# signals only and cannot select a checkpoint; the external frozen comparison evaluates
# the only comparison-of-record adapter at step 200.
[orchestrator.eval]
interval = 100
num_examples = 500
group_size = 1

[[orchestrator.eval.source]]
name = "math500"

[orchestrator.eval.source.env.taskset]
id = "math500-v1"

[orchestrator.eval.source.env.agent.harness]
id = "null"

[orchestrator.eval.source.env.agent.runtime]
type = "subprocess"

[trainer.model]
# Qwen2.5 uses the Hugging Face trainer path with the compatible FA2 implementation.
impl = "hf"
attn = "flash_attention_2"
seq_len = 16384

[inference]
enable_lora = true
seed = 0

[inference.model]
max_model_len = 8192

[orchestrator.renderer]
name = "default"
