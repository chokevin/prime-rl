[project]
name = "harder-math-v1"
version = "0.1.0"
description = "Pinned, tiered MATH and AIME tasks with deterministic boxed-answer grading."
requires-python = "~=3.12.0"
tags = ["single-turn", "math", "v1"]
dependencies = ["datasets>=4.0.0", "verifiers>=0.2.2.dev43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harder_math_v1"]

[tool.hatch.build.targets.wheel.force-include]
"harder_math_v1/sources.json" = "harder_math_v1/sources.json"
"harder_math_v1/schemas/tier_curve.v1.json" = "harder_math_v1/schemas/tier_curve.v1.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
