# Freeze (or draft) the held-out eval manifest: `tau run freeze-manifest`.
#
# CPU-only on W1-proven system nodes: securely materializes the exact model and training
# dataset as regular files, records full file/content and ordered ID/prompt/answer
# identities, loads all math500-v1 rows, proves zero train/eval overlap, and writes the
# manifest that train strictly validates. It requests zero GPUs and no H200 placement.
#
# Two-phase (see tau/eval_tools/live/freeze_manifest_live.py's docstring): run once with
# PRIME_RL_RUN_MODE=freeze-draft, measure the baseline mean via tau/eval-baseline.yaml against
# the resulting draft-manifest.json, then re-submit this same target with
# PRIME_RL_RUN_MODE=freeze-finalize with the immutable baseline rewards path.
name: prime-rl-math-7b-h200-freeze-manifest
engine: job
entrypoint: scripts/run-prime-rl.sh

runtime:
  image: ghcr.io/primeintellect-ai/prime-rl@sha256:d701d000174052a70ad060197e71915e83e0f2b1fedef956c60b3038cf2b992f
  env:
    WANDB_MODE: offline
    PRIME_RL_RUN_MODE: freeze-draft # switch to freeze-finalize for the second pass
    PRIME_RL_REPO_URL: https://github.com/chokevin/prime-rl.git
    PRIME_RL_REPO_SHA: e38f54c1e9025cffefed3efe30b94f8e24203c78
    PRIME_RL_VERIFIERS_SHA: f646beb37eef51869f886f244456e3d07818e4d6
    PRIME_RL_TASKSETS_SHA: 6a2dee6fcd805f41128dba0024f7073afd496169
    PRIME_RL_MODEL_NAME: Qwen/Qwen2.5-7B-Instruct
    PRIME_RL_MODEL_REVISION: a09a35458c702b33eeacc393d103063234e8bc28
    PRIME_RL_TRAIN_DATASET_REVISION: 3ed63f49541bdca4382fba28146aadf20d95cb38
    PRIME_RL_MANIFEST_DIR: /data/pretraining-data/prime-rl-math-7b-h200/generations/e38f54c1e9025cffefed3efe30b94f8e24203c78/manifest
    PRIME_RL_BASELINE_REWARDS_PATH: /data/pretraining-data/prime-rl-math-7b-h200/generations/e38f54c1e9025cffefed3efe30b94f8e24203c78/eval-baseline/rewards.json
    PRIME_RL_CONFIG_REL: configs/tau/math-7b-h200/train.toml
    PRIME_RL_MAX_STEPS: "50"
    PRIME_RL_EVAL_TEMPERATURE: "0.0"
    PRIME_RL_EVAL_SEED: "0"

compute:
  gpus: 0
  cpu_request: "4"
  cpu_limit: "8"
  memory_request: 16Gi
  memory_limit: 32Gi

policy:
  workspace: pretraining-data
  queue: jobqueue
  topology: independent
  node_selector:
    kubernetes.azure.com/mode: system

storage:
  data_pvc: blob-training
  output: /data/pretraining-data/prime-rl-math-7b-h200/generations/e38f54c1e9025cffefed3efe30b94f8e24203c78/manifest
