# 2 H200 (1 trainer + 1 inference): bounded RL training: `tau run train`.
#
# Runs configs/tau/math-7b-h200/train.toml via prime-rl's `rl` entrypoint, which
# supervises the trainer, orchestrator, and inference server as one process group.
# Refuses to start unless the finalized manifest, complete base snapshot, ordered
# ID/prompt/answer training identity, and final resolved RL TOML all match. The exact
# trusted Python supervisor allocates a durable attempt ID plus a fresh immutable private
# run root, downloads the model and dataset, and revalidates the exact resolved config
# immediately before launching RL itself. After RL exits zero, the supervisor writes its
# completion attestation and atomically installs the verified fixed final-adapter before
# writing training-result.json last. Attempt config/evidence remains under
# attempts/<attempt-id>/. The
# in-training startup/periodic/final eval against math500-v1 (configured in the TOML)
# is a monitoring signal only; the frozen manifest is what tau/eval-baseline.yaml and
# tau/eval-post.yaml replay for the paired comparison that is the actual hill-climb
# proof.
#
name: prime-rl-math-7b-h200-train
engine: job
entrypoint: scripts/run-prime-rl.sh

runtime:
  image: ghcr.io/primeintellect-ai/prime-rl@sha256:d701d000174052a70ad060197e71915e83e0f2b1fedef956c60b3038cf2b992f
  env:
    WANDB_MODE: offline
    PRIME_RL_RUN_MODE: train
    PRIME_RL_REPO_URL: https://github.com/chokevin/prime-rl.git
    PRIME_RL_REPO_SHA: 27359e1b1ddab6aba4d467dba76b96c2c3f9f3b8
    PRIME_RL_VERIFIERS_SHA: f646beb37eef51869f886f244456e3d07818e4d6
    PRIME_RL_TASKSETS_SHA: 6a2dee6fcd805f41128dba0024f7073afd496169
    PRIME_RL_MODEL_NAME: Qwen/Qwen2.5-7B-Instruct
    PRIME_RL_MODEL_REVISION: a09a35458c702b33eeacc393d103063234e8bc28
    PRIME_RL_CONFIG_REL: configs/tau/math-7b-h200/train.toml
    PRIME_RL_MANIFEST_DIR: /data/pretraining-data/prime-rl-math-7b-h200/generations/27359e1b1ddab6aba4d467dba76b96c2c3f9f3b8/manifest

compute:
  gpus: 2
  cpu_request: "16"
  cpu_limit: "32"
  memory_request: 128Gi
  memory_limit: 256Gi

policy:
  workspace: pretraining-data
  queue: jobqueue
  topology: single-node-nvlink
  node_selector:
    agentpool: h200pool
    kueue.azure.com/gpu-series: nd-h200-v5

storage:
  data_pvc: blob-training
  output: /data/pretraining-data/prime-rl-math-7b-h200/generations/27359e1b1ddab6aba4d467dba76b96c2c3f9f3b8/train
