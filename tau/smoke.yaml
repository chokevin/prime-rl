# CPU-only config smoke test: `tau run smoke`.
#
# Validates the full 7B training TOML (model/renderer/LoRA/taskset/eval wiring) via
# `uv run rl --dry-run`, which resolves + validates the merged config and writes
# per-process TOMLs under $TAU_OUTPUT_DIR/configs/ without starting the trainer,
# orchestrator, inference server, or downloading the model. It requests zero GPUs and
# uses the W1-proven independent placement on system CPU nodes, with no H200 selector.
name: prime-rl-math-7b-h200-smoke
engine: job
entrypoint: scripts/run-prime-rl.sh

runtime:
  image: ghcr.io/primeintellect-ai/prime-rl@sha256:d701d000174052a70ad060197e71915e83e0f2b1fedef956c60b3038cf2b992f
  env:
    WANDB_MODE: offline
    PRIME_RL_RUN_MODE: smoke
    PRIME_RL_REPO_URL: https://github.com/chokevin/prime-rl.git
    # Operator must set this to the exact commit being validated before submitting —
    # see tau/README.md's "Before every submit" step. Never leave this pointing at a
    # branch name: the overlay fetch verifies an exact SHA.
    PRIME_RL_REPO_SHA: 0cc69460234c61b1ee4da1c9f0601aa8aa3da26e
    PRIME_RL_VERIFIERS_SHA: f646beb37eef51869f886f244456e3d07818e4d6
    PRIME_RL_TASKSETS_SHA: 6a2dee6fcd805f41128dba0024f7073afd496169
    PRIME_RL_CONFIG_REL: configs/tau/math-7b-h200/train.toml

compute:
  gpus: 0
  cpu_request: "2"
  cpu_limit: "4"
  memory_request: 4Gi
  memory_limit: 8Gi

policy:
  workspace: pretraining-data
  queue: jobqueue
  topology: independent
  node_selector:
    kubernetes.azure.com/mode: system

storage:
  data_pvc: blob-training
  output: /data/pretraining-data/prime-rl-math-7b-h200/generations/0cc69460234c61b1ee4da1c9f0601aa8aa3da26e/smoke
