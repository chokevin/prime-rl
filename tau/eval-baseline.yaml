# 1 H200: frozen-eval baseline replay: `tau run eval-baseline`.
#
# Materializes the pinned model directly into fresh immutable job-private storage, starts
# a bare `uv run inference` server for that base model, replays the
# frozen (or draft, for the very first pre-freeze measurement) eval manifest against it,
# and writes rewards.json under this target's own output directory. See
# tau/eval-post.yaml for the paired post-training run and comparison.
#
# PRIME_RL_MANIFEST_PATH starts pointed at draft-manifest.json for the very first
# baseline measurement (used to decide whether this tuple is even eligible to freeze —
# see tau/freeze-manifest.yaml). It binds the draft's stable evaluation identity.
# Freeze-finalize binds this exact rewards.json SHA-256 plus the resolved RL config into
# the finalized identity, so the baseline does not need to be re-run post-freeze.
name: prime-rl-math-7b-h200-eval-baseline
engine: job
entrypoint: scripts/run-prime-rl.sh

runtime:
  image: ghcr.io/primeintellect-ai/prime-rl@sha256:d701d000174052a70ad060197e71915e83e0f2b1fedef956c60b3038cf2b992f
  env:
    WANDB_MODE: offline
    PRIME_RL_RUN_MODE: eval
    PRIME_RL_REPO_URL: https://github.com/chokevin/prime-rl.git
    PRIME_RL_REPO_SHA: 27359e1b1ddab6aba4d467dba76b96c2c3f9f3b8
    PRIME_RL_VERIFIERS_SHA: f646beb37eef51869f886f244456e3d07818e4d6
    PRIME_RL_TASKSETS_SHA: 6a2dee6fcd805f41128dba0024f7073afd496169
    PRIME_RL_MODEL_NAME: Qwen/Qwen2.5-7B-Instruct
    PRIME_RL_MODEL_REVISION: a09a35458c702b33eeacc393d103063234e8bc28
    PRIME_RL_EVAL_LABEL: baseline
    PRIME_RL_MANIFEST_PATH: /data/pretraining-data/prime-rl-math-7b-h200/generations/27359e1b1ddab6aba4d467dba76b96c2c3f9f3b8/manifest/draft-manifest.json
    PRIME_RL_BASELINE_REWARDS_PATH: /data/pretraining-data/prime-rl-math-7b-h200/generations/27359e1b1ddab6aba4d467dba76b96c2c3f9f3b8/eval-baseline/rewards.json
    PRIME_RL_HEALTH_TIMEOUT_S: "1800"

compute:
  gpus: 1
  cpu_request: "8"
  cpu_limit: "16"
  memory_request: 64Gi
  memory_limit: 128Gi

policy:
  workspace: pretraining-data
  queue: jobqueue
  topology: single-node-nvlink
  node_selector:
    agentpool: h200pool
    kueue.azure.com/gpu-series: nd-h200-v5

storage:
  data_pvc: blob-training
  output: /data/pretraining-data/prime-rl-math-7b-h200/generations/27359e1b1ddab6aba4d467dba76b96c2c3f9f3b8/eval-baseline
