# 1 H200: frozen-eval post-training replay + comparison: `tau run eval-post`.
#
# Starts a bare `uv run inference --enable-lora` server for the base model, loads the
# LoRA adapter checkpoint written by tau/train.yaml, replays the *frozen* eval manifest
# against it, writes rewards.json, then runs tau/eval_tools/cli.py compare against
# tau/eval-baseline.yaml's rewards.json and this run's rewards, writing
# comparison.json and exiting nonzero unless delta >= +0.03 and the paired-bootstrap
# 95% CI lower bound > 0.
#
# PRIME_RL_LORA_ADAPTER_PATH must point at the adapter directory tau/train.yaml wrote
# under its own output dir (trainer.ckpt.weights.save_adapter_separately = true in
# configs/tau/math-7b-h200/train.toml) — update the placeholder below once training has
# produced a checkpoint step to evaluate.
name: prime-rl-math-7b-h200-eval-post
engine: job
entrypoint: scripts/run-prime-rl.sh

runtime:
  image: RENDER_REQUIRED__see_tau/render_image.py
  env:
    WANDB_MODE: offline
    PRIME_RL_RUN_MODE: eval
    PRIME_RL_REPO_URL: https://github.com/chokevin/prime-rl.git
    PRIME_RL_REPO_SHA: REPLACE_WITH_EXACT_COMMIT_SHA
    PRIME_RL_MODEL_NAME: Qwen/Qwen2.5-7B-Instruct
    PRIME_RL_EVAL_LABEL: post
    PRIME_RL_MANIFEST_PATH: /data/pretraining-data/prime-rl-math-7b-h200/manifest/frozen-eval-manifest.json
    PRIME_RL_BASELINE_REWARDS_PATH: /data/pretraining-data/prime-rl-math-7b-h200/eval-baseline/rewards.json
    # Update to the trained adapter step directory before submitting this target.
    PRIME_RL_LORA_ADAPTER_PATH: /data/pretraining-data/prime-rl-math-7b-h200/train/weights/step_REPLACE_WITH_STEP/adapter
    PRIME_RL_HEALTH_TIMEOUT_S: "1800"
    HF_HOME: /data/pretraining-data/prime-rl-math-7b-h200/hf-cache

compute:
  gpus: 1
  cpu_request: "8"
  cpu_limit: "16"
  memory_request: 64Gi
  memory_limit: 128Gi

policy:
  workspace: pretraining-data
  queue: jobqueue
  topology: single-node-nvlink
  node_selector:
    agentpool: h200pool
    kueue.azure.com/gpu-series: nd-h200-v5

storage:
  data_pvc: blob-training
  output: /data/pretraining-data/prime-rl-math-7b-h200/eval-post
