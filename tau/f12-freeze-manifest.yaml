  cpu_request: "4"
  cpu_limit: "8"
  memory_request: 16Gi
  memory_limit: 32Gi

policy:
  workspace: pretraining-data
  queue: jobqueue
  topology: independent
  node_selector:
    kubernetes.azure.com/mode: system

storage:
  data_pvc: blob-training
  output: /data/pretraining-data/prime-rl-math-7b-h200/generations/a603e791776a4579440edc5df5b70309c61cf46a/manifest
